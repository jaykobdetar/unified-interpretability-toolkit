name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # REMOVED: CARGO_BUILD_JOBS: '1' -> Let Cargo use both available vCPUs
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 1. Setup Python with built-in pip caching
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'
          cache: 'pip'
          cache-dependency-path: 'dev/requirements-format.txt'

      # 2. Setup Node with built-in npm caching
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
          cache-dependency-path: 'dev/package-lock.json'

      # 3. Setup Rust faster and cleaner using the official action
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt

      # 4. Automatically cache Rust build targets & registry
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      # 5. Install tools (now heavily accelerated by npm/pip caches)
      - name: Install pinned optional development tools
        run: |
          python3 -m venv qualification/dev/black-26.1.0
          qualification/dev/black-26.1.0/bin/python -m pip install --require-hashes -r dev/requirements-format.txt
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm --prefix dev ci --ignore-scripts

      # REMOVED: "Reserve build disk..." step to save pipeline execution overhead. 
      # Re-add only if your build explicitly runs out of disk space (>35GB).

      - name: Unified pinned development and CI checks
        run: python3 tools/check.py all
