[package]
name = "weight-atlas-rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bounded loopback BF16 safetensors weight atlas"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.148", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.0"
libc = "=0.2.178"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
